[workspace]
resolver = "2"
members = [
    "crates/viz-core",
    "crates/viz-audio",
    "crates/viz-expr",
    "crates/viz-contract",
    "crates/viz-render",
    "crates/viz-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
authors = ["acrive82"]
license = "MIT"

[workspace.dependencies]
# internal crates
viz-core = { path = "crates/viz-core" }
viz-audio = { path = "crates/viz-audio" }
viz-expr = { path = "crates/viz-expr" }
viz-contract = { path = "crates/viz-contract" }
viz-render = { path = "crates/viz-render" }

# rendering & UI (versions pinned as a mutually compatible set)
wgpu = "29.0"
winit = "0.30.13"
egui = "0.34"
egui-wgpu = "0.34"
egui-winit = "0.34"

# audio capture & DSP
cidre = "=0.15.2" # macOS only (Core Audio tap)
realfft = "3.5.0"
triple_buffer = "9.0.0"
rtrb = "0.3.4"

# Windows audio capture (WASAPI loopback) — Windows only
windows = { version = "0.62", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Devices_Properties",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Performance",
] }
# windows-core is a direct dependency (same version the `windows` umbrella pulls)
# so the `#[implement]` macro, which emits `::windows_core` paths, resolves.
windows-core = "0.62"

# contract & serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = "1.2"
# Local schema validation only — disable the default `resolve-http` feature so the
# build does not pull reqwest/rustls/aws-lc (a C library that cannot cross-compile
# to Windows from a non-Windows host, and which ViewMusic never needs: every schema
# it validates is embedded, never fetched over the network).
jsonschema = { version = "0.46", default-features = false }
indexmap = { version = "2", features = ["serde"] }

bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

# platform & logging
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
